<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosue Events</title>
</head>
<body>
    Select Product: <select name="" id="product">

        <option value="45000">AC</option>
        <option value="22000">TV</option>
        <option value="15000">Refrigerator</option>
        <option value="70000">Laptop</option>
        
    </select>

    <br><br>

    Net Price: <input type="text" id="price"> 

    <br><br>

    Quantity: <input type="text" id="quantity">

    <br><br>

    Total Amount: <input type="text" id="amount">

    <script>

        var product = document.getElementById("product");
        var quantity =  document.getElementById("quantity");
        var price = document.getElementById("price");
        var amount = document.getElementById("amount");

        product.addEventListener("change", () => {

            price.value = product.value;

        });

        amount.addEventListener("focus", ()=> {

            amount.value=product.value * quantity.value;
            amount.style.backgroundColor = "red";
            amount.style.color = "white";

        });
    </script>

</body>
</html>
